[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#070B12"
secondaryBackgroundColor = "#0D1526"
textColor = "#F1F5F9"

# Modern, fatter geometric typography
font = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&display=swap"
headingFont = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap"
baseFontSize = 16
baseFontWeight = 600
headingFontWeights = [800, 800, 700, 700, 600, 600]
headingFontSizes = ["2.25rem", "1.7rem", "1.32rem", "1.14rem", "1rem", "0.95rem"]
metricValueFontWeight = 800
codeFontWeight = 600

borderColor = "#1E293B"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.65rem"
buttonRadius = "0.5rem"
linkColor = "#60A5FA"
codeBackgroundColor = "#0A101E"
codeTextColor = "#93C5FD"
dataframeBorderColor = "#1E293B"
dataframeHeaderBackgroundColor = "#111C33"
dataframeHeaderTextColor = "#E2E8F0"

# Clean Dark Sapphire Blue & Modern Semantic Accents
blueColor = "#3B82F6"
greenColor = "#0EA5E9"
violetColor = "#6366F1"
orangeColor = "#F59E0B"
yellowColor = "#EAB308"
redColor = "#EF4444"
grayColor = "#94A3B8"

blueBackgroundColor = "#0F2447"
greenBackgroundColor = "#0C293D"
violetBackgroundColor = "#1B1E4B"
orangeBackgroundColor = "#332207"
yellowBackgroundColor = "#302707"
redBackgroundColor = "#361111"
grayBackgroundColor = "#131C2E"

blueTextColor = "#93C5FD"
greenTextColor = "#7DD3FC"
violetTextColor = "#A5B4FC"
orangeTextColor = "#FCD34D"
yellowTextColor = "#FDE047"
redTextColor = "#FCA5A5"
grayTextColor = "#CBD5E1"

chartCategoricalColors = ["#3B82F6", "#38BDF8", "#6366F1", "#F59E0B", "#10B981", "#EF4444"]

# Single Clean 48px Architectural Grid, Solid Cards & Bold Typography
[[theme.fontFaces]]
family = "NovarixGrid"
url = "data:font/woff2;base64,"
weight_range = "400 900"
style = "normal"
unicode_range = """U+0000-FFFF; }
@keyframes cpFadeSlideIn {
  from { opacity: 0.75; transform: translateY(3px); }
  to { opacity: 1; transform: translateY(0); }
}
[data-testid="stAppViewContainer"], .stApp {
  background-color: #070B12 !important;
  background-image:
    radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.09), transparent 65%),
    linear-gradient(to right, rgba(59, 130, 246, 0.048) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(59, 130, 246, 0.048) 1px, transparent 1px) !important;
  background-size: 100% 100%, 48px 48px, 48px 48px !important;
  background-position: center top !important;
  background-attachment: fixed !important;
}
[data-testid="stMainBlockContainer"] {
  animation: cpFadeSlideIn 0.2s ease-out;
}
[data-testid="stHeader"] {
  background: rgba(7, 11, 18, 0.88) !important;
  backdrop-filter: blur(10px) !important;
  border-bottom: 1px solid rgba(59, 130, 246, 0.14) !important;
}
[data-testid="stSidebar"] {
  background-color: #05080E !important;
  background-image: none !important;
  border-right: 1px solid rgba(59, 130, 246, 0.20) !important;
}
[data-testid="stMain"] [data-testid="stVerticalBlockBorderWrapper"] {
  background-color: #0D1526 !important;
  border: 1px solid rgba(59, 130, 246, 0.22) !important;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.42) !important;
  border-radius: 0.7rem !important;
  padding: 1.15rem !important;
}
[data-testid="stSidebar"] [data-testid="stVerticalBlockBorderWrapper"] {
  background-color: #0D1526 !important;
  border: 1px solid rgba(59, 130, 246, 0.22) !important;
  border-radius: 0.65rem !important;
}
[data-testid="stIconMaterial"], .material-symbols-rounded {
  font-family: "Material Symbols Rounded" !important;
  font-weight: normal !important;
  font-style: normal !important;
  line-height: 1 !important;
}
h1, h2, h3, h4 {
  font-weight: 800 !important;
  line-height: 1.28 !important;
  letter-spacing: -0.02em !important;
}
strong, b {
  font-weight: 700 !important;
}
p, li, label {
  line-height: 1.48 !important;
}
button[kind="primary"], button[kind="secondary"] {
  height: auto !important;
  min-height: 2.65rem !important;
  padding-top: 0.45rem !important;
  padding-bottom: 0.45rem !important;
  white-space: normal !important;
  line-height: 1.3 !important;
  font-weight: 800 !important;
}
[data-testid="stMarkdownBadge"], span[data-testid="stMarkdownBadge"] {
  display: none !important;
}
.stApp { --subtle-grid-ready: 1"""

[theme.sidebar]
backgroundColor = "#05080E"
secondaryBackgroundColor = "#0D1526"
textColor = "#F1F5F9"
primaryColor = "#3B82F6"
borderColor = "#1E293B"
showWidgetBorder = true
linkColor = "#60A5FA"
codeBackgroundColor = "#090E1A"
codeTextColor = "#93C5FD"
headingFontWeights = [800, 800, 700, 700, 600, 600]

blueColor = "#3B82F6"
greenColor = "#38BDF8"
violetColor = "#818CF8"
orangeColor = "#F59E0B"
yellowColor = "#EAB308"
redColor = "#EF4444"
grayColor = "#94A3B8"

[server]
runOnSave = true
maxUploadSize = 10
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false
