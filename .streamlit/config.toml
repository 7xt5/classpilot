[theme]
base = "dark"
primaryColor = "#22C55E"
backgroundColor = "#0B110E"
secondaryBackgroundColor = "#121C17"
textColor = "#F1F7F3"

# Modern, fatter geometric typography
font = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap"
headingFont = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap"
baseFontSize = 16
baseFontWeight = 600
headingFontWeights = [800, 750, 700, 700, 650, 650]
headingFontSizes = ["2.2rem", "1.65rem", "1.3rem", "1.12rem", "1rem", "0.95rem"]
metricValueFontWeight = 800
codeFontWeight = 600

borderColor = "#1F3528"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
linkColor = "#4ADE80"
codeBackgroundColor = "#0E1712"
codeTextColor = "#86EFAC"
dataframeBorderColor = "#1F3528"
dataframeHeaderBackgroundColor = "#15231B"
dataframeHeaderTextColor = "#E2F2E7"

# Clean Dark Emerald & Modern Semantic Accents
greenColor = "#22C55E"
blueColor = "#14B8A6"
violetColor = "#34D399"
orangeColor = "#F59E0B"
yellowColor = "#EAB308"
redColor = "#EF4444"
grayColor = "#94A89B"

greenBackgroundColor = "#0D2E1B"
blueBackgroundColor = "#0C2D2B"
violetBackgroundColor = "#102E24"
orangeBackgroundColor = "#332207"
yellowBackgroundColor = "#302707"
redBackgroundColor = "#361111"
grayBackgroundColor = "#16211B"

greenTextColor = "#86EFAC"
blueTextColor = "#5EEAD4"
violetTextColor = "#6EE7B7"
orangeTextColor = "#FCD34D"
yellowTextColor = "#FDE047"
redTextColor = "#FCA5A5"
grayTextColor = "#CBD5E1"

chartCategoricalColors = ["#22C55E", "#14B8A6", "#F59E0B", "#38BDF8", "#A855F7", "#EF4444"]

# Darker Subtle Grid Background, Smooth Page Animation & Anti-Overlap Rules
[[theme.fontFaces]]
family = "ClassPilotGrid"
url = "data:font/woff2;base64,"
weight_range = "400 800"
style = "normal"
unicode_range = """U+0000-FFFF; }
@keyframes cpFadeSlideIn {
  from { opacity: 0.72; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
[data-testid="stAppViewContainer"], .stApp {
  background-color: #0B110E !important;
  background-image:
    radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.07), transparent 60%),
    linear-gradient(to right, rgba(34, 197, 94, 0.032) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(34, 197, 94, 0.032) 1px, transparent 1px),
    linear-gradient(to right, rgba(34, 197, 94, 0.065) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(34, 197, 94, 0.065) 1px, transparent 1px) !important;
  background-size: 100% 100%, 32px 32px, 32px 32px, 160px 160px, 160px 160px !important;
  background-attachment: fixed !important;
}
[data-testid="stMainBlockContainer"] {
  animation: cpFadeSlideIn 0.22s ease-out;
}
[data-testid="stHeader"] {
  background: rgba(11, 17, 14, 0.85) !important;
  backdrop-filter: blur(8px) !important;
  border-bottom: 1px solid rgba(34, 197, 94, 0.14) !important;
}
[data-testid="stSidebar"] {
  background-color: #070C09 !important;
  background-image:
    linear-gradient(to right, rgba(34, 197, 94, 0.025) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(34, 197, 94, 0.025) 1px, transparent 1px) !important;
  background-size: 32px 32px !important;
  border-right: 1px solid rgba(34, 197, 94, 0.22) !important;
}
[data-testid="stMain"] [data-testid="stVerticalBlockBorderWrapper"] {
  background-color: rgba(18, 28, 23, 0.94) !important;
  border: 1px solid rgba(34, 197, 94, 0.22) !important;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28) !important;
  border-radius: 0.65rem !important;
}
[data-testid="stSidebar"] [data-testid="stVerticalBlockBorderWrapper"] {
  background-color: rgba(16, 26, 20, 0.95) !important;
  border: 1px solid rgba(34, 197, 94, 0.24) !important;
  border-radius: 0.6rem !important;
}
[data-testid="stIconMaterial"], .material-symbols-rounded {
  font-family: "Material Symbols Rounded" !important;
  font-weight: normal !important;
  font-style: normal !important;
  line-height: 1 !important;
}
h1, h2, h3, h4 {
  line-height: 1.3 !important;
  letter-spacing: -0.015em !important;
}
p, li, label {
  line-height: 1.5 !important;
}
button[kind="primary"], button[kind="secondary"] {
  height: auto !important;
  min-height: 2.65rem !important;
  padding-top: 0.45rem !important;
  padding-bottom: 0.45rem !important;
  white-space: normal !important;
  line-height: 1.3 !important;
}
.stApp { --subtle-grid-ready: 1"""

[theme.sidebar]
backgroundColor = "#070C09"
secondaryBackgroundColor = "#101A14"
textColor = "#F1F7F3"
primaryColor = "#22C55E"
borderColor = "#1C3024"
showWidgetBorder = true
linkColor = "#4ADE80"
codeBackgroundColor = "#0B130E"
codeTextColor = "#86EFAC"
baseFontWeight = 600
headingFontWeights = [800, 750, 700, 700, 650, 650]

greenColor = "#22C55E"
blueColor = "#14B8A6"
violetColor = "#34D399"
orangeColor = "#F59E0B"
yellowColor = "#EAB308"
redColor = "#EF4444"
grayColor = "#94A89B"

[server]
maxUploadSize = 10
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false
